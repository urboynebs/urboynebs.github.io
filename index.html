<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looking for something?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100svh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:16px;
    background:linear-gradient(135deg,#0a3d91,#4facfe);
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:24px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

h1{
    color:white;
    font-size:clamp(1.8rem, 6vw, 2.5rem);
    line-height:1.2;
    margin-bottom:12px;
}

p{
    color:#e6f2ff;
    font-size:1rem;
    margin-bottom:20px;
}

.spotify-player{
    width:100%;
    height:152px;
    border:none;
    border-radius:12px;
    display:block;
}

@media (min-width:768px){
    .container{
        max-width:500px;
        padding:40px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>NOTHING TO SEE HERE</h1>
    <p>Better luck next time</p>

    <iframe
        class="spotify-player"
        src="https://open.spotify.com/embed/track/0620OecAlwJQxWieRW4L9s?utm_source=generator"
        allowfullscreen
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
    </iframe>
</div>

</body>
</html>
